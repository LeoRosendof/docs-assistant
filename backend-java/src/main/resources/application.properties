spring.application.name=backend

# H2 em arquivo: os documentos sobrevivem a reiniciar a aplicação (a pasta data/ fica fora do git).
spring.datasource.url=jdbc:h2:file:./data/docs-assistant
spring.jpa.hibernate.ddl-auto=update

# Limita o tamanho da página para o cliente não pedir tudo de uma vez.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
