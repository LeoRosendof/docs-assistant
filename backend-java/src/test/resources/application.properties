# Os testes usam um banco em memória, para não tocar nos dados reais.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# O cliente do ai-service nunca chama a rede nos testes (é simulado), mas as propriedades precisam existir.
ai-service.url=http://localhost:9
ai-service.connect-timeout=1s
ai-service.read-timeout=1s
